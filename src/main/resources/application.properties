
# ==========================================
# APLICACAO
# ==========================================
spring.application.name=smartcarbo
server.port=8080

# ==========================================
# CONEXAO COM SQL SERVER
# ==========================================
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SMARTCARBO;databaseName=smartcarbo;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${SMARTCARBO_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ==========================================
# JWT
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# ==========================================
# LOGS DE SEGURANCA
# ==========================================
logging.level.org.springframework.security=TRACE
logging.level.com.smartcarbo.config.JwtAuthenticationFilter=DEBUG
