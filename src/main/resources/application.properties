# ==========================================
# Aplicação
# ==========================================
spring.application.name=smartcarbo
server.port=8080

# ==========================================
# SQL Server
# ==========================================
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS01;databaseName=SmartCarbo;encrypt=true;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

logging.level.org.springframework.security=TRACE
logging.level.com.smartcarbo.config.JwtAuthenticationFilter=DEBUG